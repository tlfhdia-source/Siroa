      - name: Fix Java version
        working-directory: SodaHelper
        run: |
          cat >> app/build.gradle <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build APK
        working-directory: SodaHelper
        run: gradle --no-daemon assembleDebug
